services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: who-sabi-me:40.0.0
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app_data:/app/data
      - app_backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  app_data:
  app_backups:
